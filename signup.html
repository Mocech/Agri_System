<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - FarmDecide</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <!-- Navigation -->
    <header class="navbar">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full">
            <!-- Redesigned navbar with better branding and professional styling -->
            <a href="index.html" class="navbar-brand">
                <svg fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2L4 7v10c0 5.55 3.84 10.74 8 12 4.16-1.26 8-6.45 8-12V7l-8-5z"/>
                </svg>
                <span>FarmDecide</span>
            </a>
            <a href="index.html">← Back to Home</a>
        </nav>
    </header>

    <!-- Signup Container -->
    <main class="auth-container">
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join FarmDecide to get personalized farming recommendations</p>
            </div>

            <!-- Signup Form -->
            <form id="signupForm" class="auth-form" onsubmit="handleSignup(event)">
                <!-- Full Name Field -->
                <div class="form-group">
                    <label for="fullName" class="form-label">Full Name</label>
                    <input 
                        type="text" 
                        id="fullName" 
                        name="fullName" 
                        class="form-input" 
                        placeholder="John Doe"
                        required
                    >
                    <span class="form-error" id="nameError"></span>
                </div>

                <!-- Email Field -->
                <div class="form-group">
                    <label for="signupEmail" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="signupEmail" 
                        name="email" 
                        class="form-input" 
                        placeholder="your@email.com"
                        required
                    >
                    <span class="form-error" id="signupEmailError"></span>
                </div>

                <!-- Added new county search dropdown field with professional styling -->
                <div class="form-group county-search-group">
                    <div class="county-label-wrapper">
                        <svg class="county-icon" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                        </svg>
                        <label for="county" class="form-label">Select County</label>
                    </div>
                    <div style="position: relative;">
                        <input 
                            type="text" 
                            id="countySearch" 
                            class="county-search-input" 
                            placeholder="Type to search counties..."
                            autocomplete="off"
                        >
                        <div id="countyDropdown" class="county-dropdown county-scrollbar">
                            <!-- Counties will be populated by JS -->
                        </div>
                        <div id="countySelected" class="county-selected-display empty">
                            No county selected
                        </div>
                        <input type="hidden" id="county" name="county" required>
                    </div>
                    <span class="form-error" id="countyError"></span>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="signupPassword" class="form-label">Password</label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="signupPassword" 
                            name="password" 
                            class="form-input" 
                            placeholder="••••••••"
                            required
                        >
                        <!-- Replaced with proper eye icon SVG for password visibility toggle -->
                        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('signupPassword')">
                            <svg class="eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                    <span class="form-error" id="passwordError"></span>
                    <p class="password-hint">At least 8 characters with uppercase, lowercase, and number</p>
                </div>

                <!-- Confirm Password Field -->
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            class="form-input" 
                            placeholder="••••••••"
                            required
                        >
                        <!-- Replaced with proper eye icon SVG for password visibility toggle -->
                        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('confirmPassword')">
                            <svg class="eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                    <span class="form-error" id="confirmPasswordError"></span>
                </div>

                <!-- Terms Acceptance -->
                <label class="checkbox-label checkbox-terms">
                    <input type="checkbox" id="agreeTerms" name="agreeTerms" required>
                    <span>I agree to the <a href="#" class="terms-link">Terms of Service</a> and <a href="#" class="terms-link">Privacy Policy</a></span>
                </label>
                <span class="form-error" id="termsError"></span>

                <!-- Submit Button -->
                <button type="submit" class="btn-primary btn-auth">
                    <span class="btn-text">Create Account</span>
                    <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>

                <!-- Error Message -->
                <div class="form-error-container" id="formError"></div>
            </form>

            <!-- Divider -->
            <div class="divider">
                <span>Or sign up with</span>
            </div>

            <!-- Google Signup Button -->
            <button class="btn-google" type="button">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                <span>Sign up with Google</span>
            </button>

            <!-- Login Link -->
            <p class="auth-switch">
                Already have an account? <a href="login.html" class="auth-switch-link">Sign in</a>
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 text-center">
            <p class="text-gray-600 text-sm">© 2025 FarmDecide. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/auth.js"></script>
</body>
</html>
